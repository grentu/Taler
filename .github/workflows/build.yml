name: Build Taler (Windows, Android, iOS)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis and tests
        run: |
          flutter analyze
          flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Build single-file launcher
        shell: pwsh
        run: |
          cmake -S windows/onefile -B build/onefile -A x64
          cmake --build build/onefile --config Release

      - name: Package Taler-Windows-x64.exe (one file)
        shell: pwsh
        run: ./scripts/pack_onefile.ps1 -SourceDir build\windows\x64\runner\Release -Launcher build\onefile\Release\launcher.exe -Output dist\Taler-Windows-x64.exe

      - name: Smoke test the single file
        shell: pwsh
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath dist\Taler-Windows-x64.exe -ArgumentList '--taler-extract-only' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "launcher exit code $($p.ExitCode)" }
          $app = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Taler') -Directory -Filter 'app-*' | Select-Object -First 1
          if (-not $app) { throw 'launcher extracted nothing' }
          foreach ($f in @('taler.exe', 'flutter_windows.dll', 'data\app.so', 'data\icudtl.dat')) {
            if (-not (Test-Path (Join-Path $app.FullName $f))) { throw "missing $f" }
          }
          Write-Host "OK: $($app.FullName)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taler-Windows-x64
          path: dist/Taler-Windows-x64.exe

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare APK files
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Taler-Android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Taler-Android-armeabi-v7a.apk
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/Taler-Android-x86_64.apk
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Taler-Android-APKs
          path: dist/*.apk

  build-ios:
    name: iOS (Unsigned IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no-codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Taler-iOS-unsigned.ipa
        run: |
          mkdir -p dist Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r -q dist/Taler-iOS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taler-iOS-unsigned
          path: dist/Taler-iOS-unsigned.ipa

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
