name: Build Taler (Windows, Android)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis and tests
        run: |
          flutter analyze
          flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Build single-file launcher
        shell: pwsh
        run: |
          cmake -S windows/onefile -B build/onefile -A x64
          cmake --build build/onefile --config Release

      - name: Package Taler-Windows-x64.exe (one file)
        shell: pwsh
        run: ./scripts/pack_onefile.ps1 -SourceDir build\windows\x64\runner\Release -Launcher build\onefile\Release\launcher.exe -Output dist\Taler-Windows-x64.exe

      - name: Smoke test the single file
        shell: pwsh
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath dist\Taler-Windows-x64.exe -ArgumentList '--taler-extract-only' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "launcher exit code $($p.ExitCode)" }
          $app = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Taler') -Directory -Filter 'app-*' | Select-Object -First 1
          if (-not $app) { throw 'launcher extracted nothing' }
          foreach ($f in @('taler.exe', 'flutter_windows.dll', 'data\app.so', 'data\icudtl.dat')) {
            if (-not (Test-Path (Join-Path $app.FullName $f))) { throw "missing $f" }
          }
          Write-Host "OK: $($app.FullName)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taler-Windows-x64
          path: dist/Taler-Windows-x64.exe

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            KEYSTORE_PW=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
            KEY_PW=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')
            KEY_ALIAS=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > android/app/taler-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=taler-release.jks\n' \
              "$KEYSTORE_PW" "$KEY_PW" "$KEY_ALIAS" > android/key.properties
            keytool -list -keystore android/app/taler-release.jks -storepass "$KEYSTORE_PW" | grep -E "Owner:|SHA256:" || true
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret for release signing"
            exit 1
          else
            echo "No release keystore secret in PR context; using debug signing."
          fi

      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify APK signing certificate
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          else
            echo "apksigner not found; skipping v2/v3 cert check"
          fi

      - name: Prepare APK files
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Taler-Android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Taler-Android-armeabi-v7a.apk
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/Taler-Android-x86_64.apk
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Taler-Android-APKs
          path: dist/*.apk

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
