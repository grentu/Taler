<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="talerGrad" x1="8" y1="6" x2="120" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#2576FF"/>
      <stop offset="66%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#181242"/>
